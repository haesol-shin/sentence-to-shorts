name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install check dependencies in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/check-env"
          "$RUNNER_TEMP/check-env/bin/python" -m pip install markdown-it-py==3.0.0
      - name: Brand name check
        run: python scripts/check_brand.py
      - name: Public documents check
        run: |
          "$RUNNER_TEMP/check-env/bin/python" scripts/check_public_docs.py
      - name: Check script tests
        run: |
          "$RUNNER_TEMP/check-env/bin/python" -m unittest discover -s scripts/tests -v
      - name: PR commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_messages.py --range "$PR_BASE..$PR_HEAD"
