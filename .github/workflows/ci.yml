name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-text:
    name: "check | public text"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install check dependencies in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/check-env"
          "$RUNNER_TEMP/check-env/bin/python" -m pip install markdown-it-py==3.0.0
      - name: Brand name check
        run: python scripts/check_brand.py
      - name: Public documents check
        run: |
          "$RUNNER_TEMP/check-env/bin/python" scripts/check_public_docs.py
      - name: Check script tests
        run: |
          "$RUNNER_TEMP/check-env/bin/python" -m unittest discover -s scripts/tests -v
      - name: PR commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_messages.py --range "$PR_BASE..$PR_HEAD"

  check-core:
    name: "check | core lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Install the locked environment
        working-directory: core
        run: python -m poetry install
      - name: Ruff
        working-directory: core
        run: python -m poetry run ruff check .
      - name: Import contracts
        working-directory: core
        run: python -m poetry run lint-imports

  check-frontend:
    name: "check | frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test

  check-generated:
    name: "check | generated files"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Install the locked environment
        working-directory: core
        run: python -m poetry install
      - name: Regenerate JSON Schema and OpenAPI
        working-directory: core
        run: python -m poetry run python ../scripts/export_schemas.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate API types
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
      - name: Generated files match the committed files
        run: git diff --exit-code

  test-core:
    name: "test | core"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Select the tests that cover the changed paths
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$PR_BASE...$PR_HEAD" > "$RUNNER_TEMP/changed-paths.txt"
          python scripts/select_tests.py --paths-file "$RUNNER_TEMP/changed-paths.txt" > "$RUNNER_TEMP/pytest-targets.txt"
          echo "Selected test targets:"
          cat "$RUNNER_TEMP/pytest-targets.txt"
      - name: Install Poetry
        shell: bash
        run: python -m pip install poetry==2.5.1
      - name: Install the locked environment
        shell: bash
        working-directory: core
        run: python -m poetry install
      # A pull request runs the tests that cover its changed paths; a main push
      # runs everything. The marker filter keeps out the sandbox job, model
      # downloads and real provider calls. The per-test faulthandler timeout
      # dumps every thread's stack, naming the test that stops making progress,
      # so a hang leaves one named test in the log instead of only a cancel.
      - name: Unit, contract, architecture and runtime tests
        shell: bash
        working-directory: core
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            targets="$(tr -d '\r' < "$RUNNER_TEMP/pytest-targets.txt" | tr '\n' ' ')"
          else
            targets="tests"
          fi
          echo "pytest targets: $targets"
          python -m poetry run pytest $targets -q -rfE -o faulthandler_timeout=180 -m "not sandbox and not models and not realllm"

  test-frontend-e2e:
    name: "test | frontend e2e"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright in mock mode
        run: npm run test:e2e

  test-sandbox:
    name: "test | sandbox"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        shell: bash
        run: python -m pip install poetry==2.5.1
      - name: Install the locked environment
        shell: bash
        working-directory: core
        run: python -m poetry install
      - name: Download and verify the bundled runtime
        shell: bash
        working-directory: core
        env:
          APP_RUNTIME_DIR: ${{ runner.temp }}/rt
        run: python ../scripts/dev_setup.py --runtime
      - name: Sandbox tests
        shell: bash
        working-directory: core
        run: python -m poetry run pytest -m sandbox -q

  build-frontend:
    name: "build | frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build

  audit-dependency-review:
    name: "audit | dependency review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # The only check to make required. A job skipped by a condition reports
  # success, and a job that needs a failed job is skipped, so the gate reads
  # every result itself. Add a new job to `needs` in the change that creates it.
  gate:
    name: "gate | ci"
    if: always()
    needs:
      - check-text
      - check-core
      - check-frontend
      - check-generated
      - test-core
      - test-frontend-e2e
      - test-sandbox
      - build-frontend
      - audit-dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          expected_skip = {"audit-dependency-review"} if os.environ["EVENT"] != "pull_request" else set()
          failures = {}
          for name, job in sorted(needs.items()):
              result = job["result"]
              print(f"{name}: {result}")
              if result == "success":
                  continue
              if result == "skipped" and name in expected_skip:
                  continue
              failures[name] = result
          if failures:
              print(f"not green: {failures}", file=sys.stderr)
              sys.exit(1)
          PY
