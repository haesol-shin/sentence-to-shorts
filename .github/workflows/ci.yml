name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install check dependencies in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/check-env"
          "$RUNNER_TEMP/check-env/bin/python" -m pip install markdown-it-py==3.0.0
      - name: Brand name check
        run: python scripts/check_brand.py
      - name: Public documents check
        run: |
          "$RUNNER_TEMP/check-env/bin/python" scripts/check_public_docs.py
      - name: Check script tests
        run: |
          "$RUNNER_TEMP/check-env/bin/python" -m unittest discover -s scripts/tests -v
      - name: PR commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_messages.py --range "$PR_BASE..$PR_HEAD"

  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        shell: bash
        run: python -m pip install poetry==2.5.1
      - name: Install the locked environment
        shell: bash
        working-directory: core
        run: python -m poetry install
      - name: Ruff
        shell: bash
        working-directory: core
        run: python -m poetry run ruff check .
      - name: Import contracts
        shell: bash
        working-directory: core
        run: python -m poetry run lint-imports
      - name: Contract, architecture and tool tests
        shell: bash
        working-directory: core
        run: >-
          python -m poetry run pytest tests/contracts tests/architecture tests/tools -q
          -m "not sandbox and not models and not realllm"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright in mock mode
        run: npm run test:e2e

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        shell: bash
        run: python -m pip install poetry==2.5.1
      - name: Install the locked environment
        shell: bash
        working-directory: core
        run: python -m poetry install
      - name: Regenerate JSON Schema and OpenAPI
        shell: bash
        working-directory: core
        run: python -m poetry run python ../scripts/export_schemas.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate API types
        shell: bash
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run gen:api
      - name: Generated files match the committed files
        shell: bash
        run: git diff --exit-code

  sandbox:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        shell: bash
        run: python -m pip install poetry==2.5.1
      - name: Install the locked environment
        shell: bash
        working-directory: core
        run: python -m poetry install
      - name: Download and verify the bundled runtime
        shell: bash
        working-directory: core
        env:
          APP_RUNTIME_DIR: ${{ runner.temp }}/rt
        run: python ../scripts/dev_setup.py --runtime
      - name: Sandbox tests
        shell: bash
        working-directory: core
        run: python -m poetry run pytest -m sandbox -q
