name: Probe TTS

on:
  pull_request:
    paths:
      - "probes/tts/**"
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run the windows-latest matrix entries"
        type: boolean
        default: false
      threads:
        description: "Intra-op thread count for every candidate"
        type: string
        default: "4"

permissions:
  contents: read

concurrency:
  group: probe-tts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Build the candidate and runner matrix
        id: plan
        env:
          WITH_WINDOWS: ${{ github.event_name == 'workflow_dispatch' && inputs.windows || false }}
        run: |
          matrix=$(python3 - "$WITH_WINDOWS" <<'PY'
          import json
          import sys

          windows = str(sys.argv[1]).lower() == "true"
          candidates = [
              "qwen3-tts-0.6b",
              "qwen3-tts-1.7b",
              "moss-tts-nano-100m",
              "chatterbox-multilingual-v3",
          ]
          runners = ["ubuntu-24.04"] + (["windows-latest"] if windows else [])
          print(json.dumps({"include": [
              {"candidate": candidate, "os": runner}
              for runner in runners
              for candidate in candidates
          ]}))
          PY
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CANDIDATE: ${{ matrix.candidate }}
      PROBE_THREADS: ${{ github.event_name == 'workflow_dispatch' && inputs.threads || '4' }}
      PROBE_ROOT: ${{ github.workspace }}/.probe
      PROBE_MODELS_DIR: ${{ github.workspace }}/.probe/models
      HF_HOME: ${{ github.workspace }}/.probe/hf
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Create the isolated environment
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY=".venv/Scripts/python.exe"
          else
            PY=".venv/bin/python"
          fi
          echo "PY=$PY" >> "$GITHUB_ENV"
      - name: Install the candidate requirements
        shell: bash
        run: |
          started=$(date +%s)
          set +e
          "$PY" -m pip install --no-cache-dir --no-input --require-hashes \
            -r "probes/tts/$CANDIDATE/requirements.txt" > install.log 2>&1
          code=$?
          set -e
          echo "INSTALL_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
          echo "INSTALL_CODE=$code" >> "$GITHUB_ENV"
          if [ "$code" -ne 0 ]; then
            tail -n 60 install.log
          fi
      - name: Download the pinned model snapshots
        if: env.INSTALL_CODE == '0'
        shell: bash
        run: |
          set +e
          "$PY" probes/tts/common/fetch_models.py \
            --spec "probes/tts/$CANDIDATE/models.json" \
            --root "$PROBE_MODELS_DIR" > fetch.log 2>&1
          code=$?
          set -e
          echo "FETCH_CODE=$code" >> "$GITHUB_ENV"
          tail -n 40 fetch.log
      - name: Measure the candidate
        shell: bash
        run: |
          mkdir -p probe-out
          if [ "$INSTALL_CODE" != "0" ]; then
            "$PY" probes/tts/common/record_failure.py \
              --out probe-out/result.json \
              --candidate "$CANDIDATE" \
              --stage install \
              --code install_failed \
              --log install.log \
              --seconds "$INSTALL_SECONDS"
            exit 0
          fi
          if [ "${FETCH_CODE:-1}" != "0" ]; then
            "$PY" probes/tts/common/record_failure.py \
              --out probe-out/result.json \
              --candidate "$CANDIDATE" \
              --stage download \
              --code download_failed \
              --log fetch.log
            exit 0
          fi
          started=$("$PY" -c 'import time; print(int(time.time() * 1000))')
          set +e
          PROBE_START_MS="$started" "$PY" "probes/tts/$CANDIDATE/synth.py" \
            --texts probes/tts/texts.json \
            --out probe-out \
            --threads "$PROBE_THREADS" > synth.log 2>&1
          code=$?
          set -e
          tail -n 80 synth.log
          echo "SYNTH_CODE=$code" >> "$GITHUB_ENV"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi
      - name: Write the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## $CANDIDATE on $RUNNER_OS"
            echo
            "$PY" probes/tts/common/summary.py --result probe-out/result.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tts-${{ matrix.candidate }}-${{ runner.os }}
          path: |
            probe-out/result.json
            probe-out/wav/
            install.log
            fetch.log
            synth.log
          if-no-files-found: warn
          retention-days: 14

  pack:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Create the isolated environment
        shell: bash
        run: |
          python -m venv .venv
          echo "PY=.venv/bin/python" >> "$GITHUB_ENV"
      - name: Install the pack requirements
        shell: bash
        run: |
          "$PY" -m pip install --no-cache-dir --no-input --require-hashes \
            -r probes/tts/requirements-pack.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tts-*
          path: artifacts
      - name: Build the blind listening pack
        shell: bash
        run: |
          "$PY" probes/tts/make_listening_pack.py \
            --artifacts artifacts \
            --out pack \
            --key key/key.json
      - name: Write the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Listening pack"
            echo
            echo "Letters A to D hide the candidate names. The key is a separate artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: listening-pack
          path: pack/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: listening-key
          path: key/key.json
          if-no-files-found: warn
          retention-days: 14
