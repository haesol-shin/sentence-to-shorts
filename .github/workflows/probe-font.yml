name: Probe font

on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: Also run the windows-latest leg
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: probe-font-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      # The Windows leg waits for the installer work: it is added to the matrix
      # only when the dispatch asks for it. Pull request runs use ubuntu-24.04.
      - name: Choose the matrix entries
        id: platforms
        run: |
          if [ "${{ github.event.inputs.windows }}" = "true" ]; then
            echo 'platforms=["ubuntu-24.04","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["ubuntu-24.04"]' >> "$GITHUB_OUTPUT"
          fi

  probe:
    name: Measure (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install probe dependencies
        shell: bash
        run: python -m pip install --quiet --requirement probes/font/requirements.txt
      - name: Run harness unit checks
        shell: bash
        run: python -m unittest discover -s probes/font -p "test_*.py" -v
      - name: Measure fonts
        shell: bash
        env:
          PROBE_RUNNER_LABEL: ${{ matrix.os }}
        run: python probes/font/probe.py --out-dir "$RUNNER_TEMP/font-probe"
      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/font-probe/summary.md" ]; then
            cat "$RUNNER_TEMP/font-probe/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload result and sample PNGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/font-probe
          if-no-files-found: warn
          retention-days: 30

  compare:
    name: Compare digests
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download probe results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: font-probe-*
          path: ${{ runner.temp }}/font-probe-results
      - name: Install probe dependencies
        run: python -m pip install --quiet --requirement probes/font/requirements.txt
      - name: Compare pixel digests
        run: >-
          python probes/font/compare.py
          --results "$RUNNER_TEMP/font-probe-results"
          --out-dir "$RUNNER_TEMP/font-compare"
      - name: Publish job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/font-compare/compare-summary.md" ]; then
            cat "$RUNNER_TEMP/font-compare/compare-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload comparison and diff images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-probe-compare
          path: ${{ runner.temp }}/font-compare
          if-no-files-found: warn
          retention-days: 30
