name: Probe installer

on:
  pull_request:
    paths:
      - "probes/installer/**"
      - ".github/workflows/probe-installer.yml"
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run the Windows installer leg"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: probe-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan runners
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      # The Windows leg waits for the installer work. A pull request runs Linux only; the
      # dispatch input adds windows-latest.
      - name: Choose the matrix
        id: matrix
        shell: bash
        env:
          WINDOWS: ${{ inputs.windows }}
        run: |
          if [ "$WINDOWS" = "true" ]; then
            echo 'value={"include":[{"os":"ubuntu-24.04","label":"linux-x86_64"},{"os":"windows-latest","label":"windows-x86_64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'value={"include":[{"os":"ubuntu-24.04","label":"linux-x86_64"}]}' >> "$GITHUB_OUTPUT"
          fi

  probe:
    name: Probe (${{ matrix.label }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the pinned uv
        shell: bash
        # The manifest owns the version so the workflow cannot drift from the result record.
        run: |
          UV=$(python -c "import json; print(json.load(open('probes/installer/runtime.json'))['uv']['version'])")
          python -m pip install --disable-pip-version-check --no-input "uv==$UV"
      - name: Check the harness
        shell: bash
        run: python -m unittest discover -s probes/installer/tests -v
      - name: Build, install and start
        shell: bash
        # --strict turns a harness error into a failed step. A failed check of the installer
        # itself is written to result.json and still exits 0.
        run: python probes/installer/run_probe.py --output probes/installer/out --strict
      - name: Publish the job summary
        if: always()
        shell: bash
        run: |
          if [ -f probes/installer/out/summary.md ]; then
            cat probes/installer/out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-installer-${{ matrix.label }}
          path: |
            probes/installer/out/result.json
            probes/installer/out/summary.md
          if-no-files-found: warn
          retention-days: 30
