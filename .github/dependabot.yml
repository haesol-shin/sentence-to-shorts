# `pip` is the ecosystem that handles Poetry v2 (core/pyproject.toml and
# core/poetry.lock). The tool pins under packaging/ and the FFmpeg locks stay a
# manual, reviewed change. The prefix keeps the squash subject in the commit
# title format that scripts/check_commit_messages.py checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps): "

  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps): "
    # The torch and torchaudio CPU builds come from the PyTorch CPU index,
    # which Dependabot cannot resolve, so the pins stay a manual change.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchaudio"

  # WhisperX 3.8.6 pins torch~=2.8.0 and huggingface-hub<1.0, so the patched
  # torch and transformers cannot install here. The ci.yml allow list is the
  # only place that lists their advisories. Remove this ignore when WhisperX
  # allows the patched versions.
  - package-ecosystem: pip
    directory: /core/align_runtime
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build(deps): "
    ignore:
      - dependency-name: "torch"
      - dependency-name: "transformers"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps): "
    # These versions are fixed by docs/CONTRACTS.md 16.1 and change only with
    # that section, so dependabot must not open PRs that CI rejects.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
