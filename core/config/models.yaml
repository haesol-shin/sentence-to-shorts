# LLM routing. Model IDs are the official Claude API IDs for Claude Haiku 5.5 and
# Claude Sonnet 5.5. openai_compat model ids are set by the endpoint profile.

models:
  haiku:
    anthropic_api: claude-haiku-5-5
    claude_cli: haiku
    openai_compat: ""
  sonnet:
    anthropic_api: claude-sonnet-5-5
    claude_cli: sonnet
    openai_compat: ""

routes:
  draft:
    model: haiku
    effort: low
    timeout_s: 60
    retries: 2
  script.numbered_three:
    model: haiku
    effort: low
    timeout_s: 90
    retries: 2
  script.default:
    model: sonnet
    effort: medium
    timeout_s: 120
    retries: 2
  split:
    model: haiku
    effort: low
    timeout_s: 60
    retries: 2
  scene_data:
    model: haiku
    effort: low
    timeout_s: 90
    retries: 2
  chat:
    model: haiku
    effort: low
    timeout_s: 60
    retries: 2
  scene_rewrite:
    model: sonnet
    effort: medium
    timeout_s: 90
    retries: 2
  precheck:
    model: haiku
    effort: low
    timeout_s: 60
    retries: 1
  reference_vision:
    model: sonnet
    effort: medium
    timeout_s: 120
    retries: 1
  style_code:
    model: sonnet
    effort: high
    timeout_s: 240
    retries: 1
  template_code:
    model: sonnet
    effort: high
    timeout_s: 240
    retries: 1
  bgm_code:
    model: sonnet
    effort: high
    timeout_s: 180
    retries: 1
