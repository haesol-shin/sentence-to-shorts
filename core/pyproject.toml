[project]
name = "core"
version = "0.1.0"
description = "Contracts and execution skeleton for the local video studio backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic==2.8.0",
    "accelerate==1.12.0",
    "av==15.1.0",
    "ctranslate2==4.6.0",
    "einops==0.8.2",
    "faster-whisper==1.2.1",
    "huggingface-hub==0.36.2",
    "librosa==0.11.0",
    "numpy==2.2.6",
    "onnxruntime==1.22.0",
    "fastapi==0.162.7",
    "fonttools==4.68.0",
    "pillow==13.0.0",
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "pydantic==2.14.3",
    "python-multipart==0.0.33",
    "pyyaml==6.0.3",
    "soundfile==0.14.0",
    "sox==1.5.0",
    "tokenizers==0.22.2",
    "torch==2.7.1+cpu",
    "torchaudio==2.7.1+cpu; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "torchaudio>=2.7.1,<2.7.1.post0,!=2.7.1+cpu; platform_machine == 'aarch64'",
    "transformers==4.57.3",
    "typing-extensions==4.16.0",
    "uvicorn==0.54.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = { version = "2.7.1+cpu", source = "pytorch-cpu" }
torchaudio = [
    { version = "2.7.1+cpu", source = "pytorch-cpu", markers = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" },
    # Keep range form: Poetry collapses ==2.7.1,!=2.7.1+cpu to ==2.7.1.
    # The post0 bound excludes later releases while retaining the CPU exclusion.
    { version = ">=2.7.1,<2.7.1.post0,!=2.7.1+cpu", source = "pytorch-cpu", markers = "platform_machine == 'aarch64'" },
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
httpx2 = "2.16.0"
import-linter = "2.16"
pytest = "9.2.0"
pytest-timeout = "2.4.0"
ruff = "0.17.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 180
markers = [
    "sandbox: needs the bundled Deno and Pyodide runtime files",
    "models: needs downloaded model files",
    "realllm: calls a real LLM provider",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["C901", "E", "F", "I"]
mccabe = { max-complexity = 15 }

[tool.ruff.lint.per-file-ignores]
"tests/architecture/fixtures/**" = ["E501"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "application direction"
type = "layers"
layers = [
    "app.main",
    "app.bootstrap",
    "app.routers | app.access",
    "app.services.pipeline",
    "app.services.project | app.services.story | app.services.reference | app.services.render | app.services.voice | app.services.sound | app.services.assemble | app.services.templates",
    "app.jobs | app.storage | app.runtime | app.llm | app.tools | app.plugins",
    "app.ports",
    "app.schemas",
]

[[tool.importlinter.contracts]]
name = "services use contracts not implementations"
type = "forbidden"
source_modules = ["app.services", "app.routers"]
forbidden_modules = ["app.jobs", "app.storage", "app.runtime", "app.llm", "app.tools", "app.plugins"]
