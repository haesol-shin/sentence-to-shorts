[project]
name = "align-runtime"
version = "0.1.0"
description = "Isolated WhisperX runtime for forced alignment"
requires-python = ">=3.11,<3.12"
# WhisperX itself is installed from its pinned wheel without dependencies by
# install_whisperx.py. Its alignment module imports only these packages, so the
# lock carries the alignment path and not the transcription, diarization,
# vision or codec packages that its metadata declares.
dependencies = [
    "huggingface-hub==0.36.2",
    "nltk==3.10.4",
    "numpy==2.4.6",
    "pandas==3.1.1",
    "torch==2.8.0+cpu",
    "torchaudio==2.8.0+cpu; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "torchaudio>=2.8.0,<2.8.0.post0,!=2.8.0+cpu; platform_machine == 'aarch64'",
    "transformers==4.57.6",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = { version = "2.8.0+cpu", source = "pytorch-cpu" }
torchaudio = [
    { version = "2.8.0+cpu", source = "pytorch-cpu", markers = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" },
    # Keep range form: Poetry collapses ==2.8.0,!=2.8.0+cpu to ==2.8.0.
    # The post0 bound excludes later releases while retaining the CPU exclusion.
    { version = ">=2.8.0,<2.8.0.post0,!=2.8.0+cpu", source = "pytorch-cpu", markers = "platform_machine == 'aarch64'" },
]

[tool.poetry.group.audit]
# Dependency review reads the Poetry lock. Keep the packages WhisperX declares
# there so their versions stay under audit, but never install this optional
# group: the alignment path does not import them.
optional = true

[tool.poetry.group.audit.dependencies]
whisperx = "==3.8.6"
pyannote-audio = "==4.0.7"
torchcodec = "==0.7.0"
torchvision = [
    { version = "==0.23.0+cpu", source = "pytorch-cpu", markers = "platform_machine == 'x86_64' or platform_machine == 'AMD64'" },
    { version = ">=0.23.0,<0.23.0.post0,!=0.23.0+cpu", markers = "platform_machine == 'aarch64'" },
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
